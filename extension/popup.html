<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Google Flow Bridge</title>
  <style>
    body {
      width: 280px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }
    h3 {
      margin-top: 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .status-connected {
      background: #1e7e34;
      color: #fff;
    }
    .status-disconnected {
      background: #d9534f;
      color: #fff;
    }
    .info {
      font-size: 12px;
      color: #aaa;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: #0070f3;
      color: white;
      text-align: center;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #005bb5;
    }
  </style>
</head>
<body>
  <h3>⚡ Google Flow Bridge</h3>
  <div id="status" class="status-badge status-disconnected">Checking server...</div>
  <div class="info">
    Bridges local Python CLI, OpenAI-compatible REST API, and MCP tools to this browser session.
  </div>
  <button id="checkBtn" class="btn">Check Status</button>

  <script src="popup.js"></script>
</body>
</html>
